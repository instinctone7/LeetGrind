services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leetgrind
      MYSQL_USER: leetgrind
      MYSQL_PASSWORD: ${LEETGRIND_DB_PASSWORD:?Set LEETGRIND_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LEETGRIND_MYSQL_ROOT_PASSWORD:?Set LEETGRIND_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${LEETGRIND_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
  app:
    build: .
    environment:
      LEETGRIND_DB_URL: jdbc:mysql://db:3306/leetgrind
      LEETGRIND_DB_USER: leetgrind
      LEETGRIND_DB_PASSWORD: ${LEETGRIND_DB_PASSWORD:?Set LEETGRIND_DB_PASSWORD}
      LEETGRIND_JWT_SECRET: ${LEETGRIND_JWT_SECRET:?Set LEETGRIND_JWT_SECRET}
      LEETGRIND_BROWSER_ORIGIN: http://127.0.0.1:${LEETGRIND_PORT:-8080}
      LEETGRIND_SECURE_COOKIE: "false"
      LEETGRIND_FIXTURES_ENABLED: ${LEETGRIND_FIXTURES_ENABLED:-false}
      LEETGRIND_PROFILE_SERVICE_URL: ${LEETGRIND_PROFILE_SERVICE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEETGRIND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  mysql-data:
