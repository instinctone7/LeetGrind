            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PracticeCatalogProblem'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /me/analytics:
    get:
      operationId: getPersonalAnalytics
      summary: Get personal practice summaries, UTC trends, and problem recommendations
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionMode'
      - name: period
        in: query
        schema: {type: string, enum: [all-time, weekly, monthly], default: all-time}
        description: Filter the summary only. Trends and recommendations use the available recorded history.
      - name: start
        in: query
        schema: {type: string, format: date}
        description: UTC Monday for a weekly summary or first of month for a monthly summary. Omit for the current period.
      responses:
        '200':
          description: Personal practice analytics.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAnalytics'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /me/rewards:
    get:
      operationId: getPracticeRewards
      summary: Get your coding calendar, streaks, level, and current rewards
      security:
      - AccessToken: []
      parameters:
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - live
          - demo
          default: live
        description: Demo rewards are available only with fixtures enabled.
      responses:
        '200':
          description: UTC practice rewards.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeRewards'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/featured-problem:
    get:
