openapi: 3.1.0
info:
  title: LeetGrind API
  version: 0.7.0
  description: |
    LeetGrind identity, practice, group competition, and personal analytics API. All responses include X-Correlation-ID. Error bodies
    include the same ID to support diagnostics.
    XP history and standings use an opaque cursor with a bounded limit and return
    items and a nullable nextCursor.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/BrowserClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          $ref: '#/components/responses/Profile'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ApiError'
  /auth/login:
    post:
      operationId: login
      summary: Start an account session
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/BrowserClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          $ref: '#/components/responses/Access'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ApiError'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh credential and issue a new access JWT
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/BrowserClient'
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          $ref: '#/components/responses/Access'
        '401':
          $ref: '#/components/responses/InvalidRefresh'
        '403':
          $ref: '#/components/responses/ApiError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the session and clear the refresh cookie
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/BrowserClient'
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          description: Session ended. Calling this again returns the same status.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '403':
          $ref: '#/components/responses/ApiError'
  /me:
    get:
      operationId: getProfile
      summary: Get your profile
      security:
        - AccessToken: []
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '401':
          $ref: '#/components/responses/ApiError'
    patch:
      operationId: updateProfile
      summary: Update your display name
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
  /me/delete:
    post:
      operationId: deleteAccount
      summary: Permanently delete your account and practice and group scores
      description: Transfer or close open groups you own before deleting your account.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  writeOnly: true
      responses:
        '204':
          description: Account removed and refresh cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/leetcode-link:
    get:
      operationId: getLeetcodeLink
      summary: Get your link and current synchronization state
      security:
        - AccessToken: []
      responses:
        '200':
          $ref: '#/components/responses/LinkStatus'
        '401':
          $ref: '#/components/responses/ApiError'
    put:
      operationId: putLeetcodeLink
      summary: Save or replace a provider handle using a handle or profile URL
      description: Live handles stay pending. Optional local mode can verify an account-scoped synthetic profile.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          $ref: '#/components/responses/LinkStatus'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: disconnectLeetcodeLink
      summary: Disconnect the active profile while preserving prior credits
      security:
        - AccessToken: []
      responses:
        '204':
          description: The account has no active link.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/ApiError'
  /me/leetcode-link/preview:
    get:
      operationId: previewLeetcodeProfile
      summary: Preview public LeetCode data for a supplied or saved handle
      description: Returns a read-only snapshot. Preview data never verifies ownership or awards XP.
      security:
        - AccessToken: []
      parameters:
        - name: handle
          in: query
          description: A LeetCode handle or profile URL. Omit to use the account's saved handle.
          schema: {type: string, maxLength: 256}
      responses:
        '200':
          description: Profile identity, ranking, solve counts, calendar activity, and recent accepted submissions.
          content:
            application/json:
              schema:
                type: object
                required: [username, problemsSolved, heatmap, recentSubmissions]
                properties:
                  username: {type: string}
                  realName: {type: [string, 'null']}
                  ranking: {type: [integer, 'null']}
                  problemsSolved:
                    type: object
                    properties:
                      all: {type: integer}
                      easy: {type: integer}
                      medium: {type: integer}
                      hard: {type: integer}
                  heatmap:
                    type: object
                    properties:
                      streak: {type: integer}
                      totalActiveDays: {type: integer}
                      activityDays:
                        type: array
                        items:
                          type: object
                          properties:
                            date: {type: string, format: date}
                            submissions: {type: integer}
                  recentSubmissions:
                    type: array
                    items:
                      type: object
                      properties:
                        title: {type: string}
                        titleSlug: {type: string}
                        timestamp: {type: integer, format: int64}
                        lang: {type: [string, 'null']}
                        difficulty:
                          type: [string, 'null']
                          enum: [EASY, MEDIUM, HARD, null]
                          description: Problem difficulty when available for a public accepted submission.
        '204':
          description: Profile previews are disabled for this deployment.
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '502':
          $ref: '#/components/responses/ApiError'
  /me/leetcode-link/verify:
    post:
      operationId: verifyLeetcodeLink
      summary: Verify control of the saved public LeetCode profile
      security:
        - AccessToken: []
      responses:
        '200':
          $ref: '#/components/responses/LinkStatus'
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '502':
          $ref: '#/components/responses/ApiError'
  /me/leetcode-link/sync:
    post:
      operationId: syncLeetcodeLink
      summary: Sync the newest public LeetCode solve or queue demo synchronization
      security:
        - AccessToken: []
      responses:
        '202':
          $ref: '#/components/responses/LinkStatus'
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '502':
          $ref: '#/components/responses/ApiError'
  /me/progress:
    get:
      operationId: getPracticeProgress
      summary: Get your live and demo base-solve XP and counts
      security:
        - AccessToken: []
      responses:
        '200':
          description: Practice progress.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [totalXp, solvedCount, fixtureXp, fixtureSolvedCount]
                properties:
                  totalXp:
                    type: integer
                    format: int64
                  solvedCount:
                    type: integer
                    format: int64
                  fixtureXp:
                    type: integer
                    format: int64
                  fixtureSolvedCount:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/ApiError'
  /me/check-in:
    post:
      operationId: recordDailyCheckIn
      summary: Award daily login XP once per UTC day
      security:
        - AccessToken: []
      responses:
        '200':
          description: The start of the next UTC reward day.
          content:
            application/json:
              schema:
                type: object
                required: [nextCheckInAt]
                properties:
                  nextCheckInAt: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/ApiError'
  /me/reward-events:
    get:
      operationId: getRecentRewardEvents
      summary: List recently recorded login rewards, verified solves, and achievements
      security:
        - AccessToken: []
      responses:
        '200':
          description: Up to twenty events recorded in the last ten minutes.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, label, amount, occurredAt]
                  properties:
                    id: {type: string}
                    kind: {type: string, enum: [DAILY_LOGIN, BASE_SOLVE, ACHIEVEMENT]}
                    label: {type: [string, 'null']}
                    amount: {type: [integer, 'null']}
                    occurredAt: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/ApiError'
  /me/xp-entries:
    get:
      operationId: getXpHistory
      summary: Get your XP history newest first
      security:
        - AccessToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: nextCursor from a previous page for this account.
          schema:
            type: string
      responses:
        '200':
          description: XP entries with their source.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/XpEntry'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /groups:
    get:
      operationId: listPrivateGroups
      summary: List your current private groups
      security:
      - AccessToken: []
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDirectory'
        '401':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createPrivateGroup
      summary: Create a public or private group and become its owner
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSettings'
      responses:
        '201':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSummary'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
  /groups/overview:
    get:
      operationId: getJoinedGroupOverview
      summary: Read weekly verified solve totals and current member previews for your joined groups
      security:
      - AccessToken: []
      responses:
        '200':
          description: Current group summaries for the UTC week.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, weeklyXp, weeklySolves, personalXp, memberCount, memberInitials, lastSolveAt]
                  properties:
                    id: {type: string}
                    weeklyXp: {type: integer, format: int64}
                    weeklySolves: {type: integer, format: int64}
                    personalXp: {type: integer, format: int64}
                    memberCount: {type: integer, format: int64}
                    memberInitials: {type: string, maxLength: 3}
                    lastSolveAt: {type: [string, 'null'], format: date-time}
        '401':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    get:
      operationId: getPrivateGroup
      summary: Get a joined group and its current members
      security:
      - AccessToken: []
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    patch:
      operationId: updatePrivateGroup
      summary: Update group settings as owner
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSummary'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: closePrivateGroup
      summary: Close a group as owner and end its active memberships
      security:
      - AccessToken: []
      responses:
        '204':
          description: No content.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/ownership:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    post:
      operationId: transferGroupOwnership
      summary: Transfer ownership to a current member
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              properties:
                accountId:
                  type: string
                  pattern: ^[1-9][0-9]{0,18}$
      responses:
        '204':
          description: No content.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/members/{accountId}:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    - name: accountId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    delete:
      operationId: removeGroupMember
      summary: Leave the group or remove a member as owner
      security:
      - AccessToken: []
      responses:
        '204':
          description: No content.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /group-memberships:
    post:
      operationId: redeemPrivateGroupInvite
      summary: Join a private group by invitation
      security:
      - AccessToken: []
      description: An existing member can retry redemption without consuming an additional use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  maxLength: 64
                  minLength: 1
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSummary'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/invites:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    get:
      operationId: listGroupInvites
      summary: List invitation metadata as owner
      security:
      - AccessToken: []
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupInvite'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createGroupInvite
      summary: Create an expiring invitation as owner
      security:
      - AccessToken: []
      description: The invitation code is returned on creation. It is never included in subsequent reads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expiresInHours
              - maxUses
              properties:
                expiresInHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                maxUses:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '201':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedGroupInvite'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/invites/{inviteId}:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    delete:
      operationId: revokeGroupInvite
      summary: Revoke an invitation as owner
      security:
      - AccessToken: []
      responses:
        '204':
          description: No content.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /leaderboard:
    get:
      operationId: getIndividualStandings
      summary: Rank the caller and current members of their open groups by live XP
      security:
      - AccessToken: []
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum: [weekly, monthly, all-time]
          default: weekly
      - name: week
        in: query
        schema:
          type: string
          format: date
        description: Monday in UTC for weekly standings. Defaults to the current week.
      - name: month
        in: query
        schema:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: UTC month for monthly standings. Defaults to the current month.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
        description: Use the nextCursor from the same account, period, and date.
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStandings'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/leaderboard:
    parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    get:
      operationId: getWeeklyGroupStandings
      summary: Get weekly, monthly, or all-time standings for a joined group
      description: Live standings count verified solve, quest, and check-in XP earned during group membership.
      security:
      - AccessToken: []
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - weekly
          - monthly
          - all-time
          default: weekly
      - name: week
        in: query
        schema:
          type: string
          format: date
        description: Monday in UTC for weekly standings. Defaults to the current week.
      - name: month
        in: query
        schema:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: UTC month for monthly standings. Defaults to the current month.
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - live
          - demo
          default: live
        description: Demo mode requires fixtures.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
        description: Use the nextCursor from the same group, period, date and mode.
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStandings'
        '401':
          $ref: '#/components/responses/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /me/practice-catalog:
    get:
