      - name: mode
        in: query
        schema:
          type: string
          enum:
          - live
          - demo
          default: live
        description: Demo rewards are available only with fixtures enabled.
      responses:
        '200':
          description: UTC practice rewards.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFeatured'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /groups/public:
    get:
      operationId: discoverPublicGroups
      summary: Discover public groups you can join
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicGroup'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/join:
    post:
      operationId: joinPublicGroup
      summary: Join an open public group
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionGroupId'
