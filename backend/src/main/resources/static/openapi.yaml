  /groups/{groupId}/duels:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: {type: string}
    post:
      operationId: createTimedDuel
      summary: Validate a LeetCode problem and invite a group member to a timed XP duel
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteeId, problemUrl, durationMinutes, stakeXp]
              properties:
                inviteeId: {type: string}
                problemUrl: {type: string, format: uri, maxLength: 300}
                durationMinutes: {type: integer, minimum: 10, maximum: 120}
                stakeXp: {type: integer, enum: [5, 25, 50, 100]}
      responses:
        '201':
          description: The invitation and server-validated problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeView'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/duels/summary:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: {type: string}
    get:
      operationId: getDuelSummary
      summary: Get available XP and duel results for the current group
      security:
      - AccessToken: []
      responses:
        '200':
          description: Available XP excludes reserved stakes on unsettled duels.
          content:
            application/json:
              schema:
                type: object
                required: [availableXp, wins, losses, netXp]
                properties:
                  availableXp: {type: integer, format: int64}
                  wins: {type: integer, format: int64}
                  losses: {type: integer, format: int64}
                  netXp: {type: integer, format: int64}
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/challenges:
    get:
      operationId: listGroupChallenges
      summary: List group challenges and your duels
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionGroupId'
      - $ref: '#/components/parameters/CompetitionMode'
      - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createFixtureDuel
      summary: Invite an opponent to a legacy fixture duel
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '201':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeView'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/challenges/{challengeId}:
    get:
      operationId: getGroupChallenge
      summary: Get rules, participant progress and the finalized result
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionGroupId'
      - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeView'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /groups/{groupId}/challenges/{challengeId}/enrollment:
    post:
      operationId: enrollInChallenge
      summary: Enroll in a group challenge or accept a duel
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionGroupId'
      - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeView'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /me/notifications:
    get:
      operationId: getNotifications
      summary: Get up to 50 accessible notifications
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/BeforeId'
      responses:
        '200':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /me/notifications/{notificationId}/read:
    post:
      operationId: readNotification
      summary: Mark an accessible notification read
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: Successful request.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CompetitionGroupId:
      name: groupId
      in: path
      required: true
      schema: {type: string}
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema: {type: string}
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: {type: string}
    BeforeId:
      name: before
      in: query
      description: Optional exclusive ID from the last item in the previous page.
      schema: {type: integer, format: int64}
    CompetitionMode:
      name: mode
      in: query
      description: Demo mode is available with fixtures enabled.
      schema: {type: string, enum: [live, demo], default: live}
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      description: The configured LeetGrind web origin.
      schema:
        type: string
    BrowserClient:
      name: X-LeetGrind-Client
      in: header
      required: true
      schema:
        const: browser
    RefreshCookie:
      name: __Host-leetgrind_refresh
      in: cookie
      description: The loopback HTTP development profile uses leetgrind_refresh.
      schema:
        type: string
  headers:
    CorrelationId:
      schema:
        type: string
        format: uuid
    RefreshCookie:
      description: HttpOnly and SameSite=Strict. Secure is used outside loopback development.
      schema:
        type: string
  responses:
    LinkStatus:
      description: Profile linking and synchronization status visible to the owner.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LinkStatus'
    Profile:
      description: Private profile of the account owner. Only handle and displayName are public identity fields.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile'
    Access:
      description: Short-lived access JWT and rotated refresh cookie.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Access'
    ApiError:
      description: Request rejected.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidRefresh:
      description: Refresh credential is unavailable or invalid. The refresh cookie is cleared.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          schema:
            type: integer
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    PracticeCatalogProblem:
      type: object
      required: [slug, title, difficulty, solved, topics]
      properties:
        slug: {type: string}
        title: {type: string}
        difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
        solved: {type: boolean}
        topics:
          type: array
          items: {type: string}
    PersonalAnalytics:
      type: object
      required: [mode, demoAvailable, timezone, generatedAt, coverage, summary, streaks, weekly, monthly, recommendations, dailyActivity]
      properties:
        mode: {type: string, enum: [live, demo]}
        demoAvailable: {type: boolean}
        timezone: {const: UTC}
        generatedAt: {type: string, format: date-time}
        coverage:
          type: object
          required: [state, trackedSince, lastSuccessfulSyncAt, historicalImportAvailable]
          properties:
            state: {type: string, enum: [UNAVAILABLE, NO_LINK, AWAITING_SYNC, PARTIAL, TRACKED_ONLY, DISCONNECTED]}
            trackedSince: {type: [string, 'null'], format: date-time}
            lastSuccessfulSyncAt: {type: [string, 'null'], format: date-time}
            historicalImportAvailable: {type: boolean}
        summary:
          $ref: '#/components/schemas/AnalyticsSummary'
        streaks:
          type: object
          required: [current, longest]
          properties:
            current: {type: integer, minimum: 0}
            longest: {type: integer, minimum: 0}
        dailyActivity:
          type: array
          description: UTC days with recorded solves within the last 365 days.
          items:
            type: object
            required: [date, solves]
            properties:
              date: {type: string, format: date}
              solves: {type: integer, minimum: 1}
        weekly:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/AnalyticsBucket'
        monthly:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/AnalyticsBucket'
        recommendations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PracticeRecommendation'
    AnalyticsSummary:
      type: object
      required: [period, start, end, solved, unmapped, xpEarned, codingDays, byDifficulty, topics]
      properties:
        period: {type: string, enum: [all-time, weekly, monthly]}
        start:
          type: [string, 'null']
          format: date
          description: Inclusive UTC date. Null for all time.
        end:
          type: [string, 'null']
          format: date
          description: Exclusive UTC date. Null for all time.
        solved: {type: integer, minimum: 0}
        unmapped: {type: integer, minimum: 0}
        xpEarned: {type: integer, format: int64}
        codingDays: {type: integer, minimum: 0}
        byDifficulty:
          type: array
          items:
            type: object
            required: [difficulty, solved, unmapped]
            properties:
              difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
              solved: {type: integer, minimum: 0}
              unmapped: {type: integer, minimum: 0}
        topics:
          type: array
          description: One first solve can contribute to several mapped topics.
          items:
            type: object
            required: [topic, solved]
            properties:
              topic: {type: string}
              solved: {type: integer, minimum: 0}
    AnalyticsBucket:
      type: object
      required: [start, end, solved, codingDays, xpEarned, totalXp]
      properties:
        start: {type: string, format: date}
        end:
          type: string
          format: date
          description: Exclusive UTC date.
        solved: {type: integer, minimum: 0}
        codingDays: {type: integer, minimum: 0}
        xpEarned: {type: integer, format: int64}
        totalXp:
          type: integer
          format: int64
          description: Cumulative XP including the balance before the displayed timeline.
    PracticeRecommendation:
      type: object
      required: [id, slug, title, difficulty, topics, focusTopic, recordedInFocusTopic, reason, url]
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
        topics:
          type: array
          items: {type: string}
        focusTopic: {type: string}
        recordedInFocusTopic: {type: integer, minimum: 0}
        reason: {type: string}
        url:
          type: [string, 'null']
          format: uri
          description: LeetCode link for an actual catalog problem. Null for synthetic demo problems.
    PublicGroup:
      type: object
      required: [id, name, description]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
    ChallengeRequest:
      type: object
      required: [title, kind, rule, mode, inviteeId, endsAt]
      properties:
        title: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [DUEL]}
        rule: {type: string, enum: [PROBLEM, COUNT, DIFFICULTY]}
        mode: {type: string, enum: [demo]}
        inviteeId:
          type: string
          description: Required for duels. The invited account must be a current member of the group.
        problemSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 128
          description: Required for a specific problem. Use its provider slug.
        difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
        target: {type: integer, minimum: 1, maximum: 100}
        startsAt:
          type: string
          format: date-time
          description: Optional UTC start up to 90 days ahead. Defaults to creation time.
        endsAt:
          type: string
          format: date-time
          description: Exclusive deadline at most 30 days after the start.
    Challenge:
      type: object
      required: [id, title, kind, rule, mode, problemSlug, difficulty, target, startsAt, endsAt, cutoffAt, ruleVersion, status, enrolled, finalizedAt, outcome]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {type: string, enum: [GROUP, DUEL]}
        rule: {type: string, enum: [PROBLEM, COUNT, DIFFICULTY]}
        mode: {type: string, enum: [live, demo]}
        problemSlug: {type: [string, 'null']}
        difficulty: {type: [string, 'null'], enum: [EASY, MEDIUM, HARD, null]}
        target: {type: integer, minimum: 1}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        cutoffAt: {type: string, format: date-time}
        ruleVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [SCHEDULED, AWAITING_OPPONENT, ACTIVE, GRACE, FINALIZED]}
        enrolled: {type: integer, minimum: 0}
        finalizedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: [string, 'null'], enum: [WIN, TIE, NO_SCORE, CANCELLED, null]}
        durationMinutes: {type: [integer, 'null'], minimum: 10, maximum: 120}
        stakeXp: {type: [integer, 'null']}
        problemUrl: {type: [string, 'null'], format: uri}
        xpDelta: {type: [integer, 'null']}
        opponent: {type: [string, 'null']}
    ChallengeView:
      type: object
      required: [challenge, participants, canEnroll]
      properties:
        challenge:
          $ref: '#/components/schemas/Challenge'
        participants:
          type: array
          items:
            type: object
            required: [id, handle, displayName, enrolledAt, score, winner]
            properties:
              id: {type: string}
              handle: {type: string}
              displayName: {type: string}
              enrolledAt: {type: [string, 'null'], format: date-time}
              score: {type: integer, minimum: 0}
              winner: {type: boolean}
              xpDelta: {type: [integer, 'null']}
        canEnroll: {type: boolean}
    Notification:
      type: object
      required: [id, kind, label, groupId, groupName, challengeId, challengeTitle, createdAt, readAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [INVITATION, CHALLENGE_RESULT, ACHIEVEMENT, STANDINGS_CHANGE]}
        label: {type: [string, 'null']}
        groupId: {type: [string, 'null']}
        groupName: {type: [string, 'null']}
        challengeId: {type: [string, 'null']}
        challengeTitle: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        readAt: {type: [string, 'null'], format: date-time}
    RewardTask:
      type: object
      required:
      - kind
      - startsAt
      - endsAt
      - cutoffAt
      - ruleVersion
      - rewardXp
      - target
      - completed
      - topic
      - eligibleProblemSlugs
      properties:
        kind:
          type: string
          enum:
          - FEATURED
          - DAILY_QUEST
          - WEEKLY_QUEST
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        ruleVersion:
          type: integer
          minimum: 0
        rewardXp:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        topic:
          type:
          - string
          - 'null'
        eligibleProblemSlugs:
          type: array
          description: Snapshotted eligible catalog problems for a topic-based quest.
          items:
            type: string
    PracticeRewards:
      type: object
      required:
      - mode
      - totalXp
      - ledgerRevision
      - level
      - activity
      - loginStreak
      - recentSolves
      - featured
      - quests
      - badges
      properties:
        mode:
          type: string
          enum:
          - live
          - demo
        totalXp:
          type: integer
          minimum: 0
        ledgerRevision:
          type:
          - string
          - 'null'
        level:
          type: object
          required:
          - number
          - minimumXp
          - nextXp
          - ruleVersion
          properties:
            number:
              type: integer
              minimum: 0
            minimumXp:
              type: integer
              minimum: 0
            nextXp:
              type:
              - integer
              - 'null'
            ruleVersion:
              type: integer
              minimum: 0
        activity:
          type: object
          required:
          - currentStreak
          - longestStreak
          - calendarStart
          - calendarEnd
          - codingDates
          properties:
            currentStreak:
              type: integer
              minimum: 0
            longestStreak:
              type: integer
              minimum: 0
            calendarStart:
              type: string
              format: date
            calendarEnd:
              type: string
              format: date
            codingDates:
              type: array
              items:
                type: string
                format: date
        loginStreak:
          type: object
          required: [currentStreak, longestStreak]
          properties:
            currentStreak: {type: integer, minimum: 0}
            longestStreak: {type: integer, minimum: 0}
        recentSolves:
          type: array
          description: Credited first solves from the last seven UTC days.
          items:
            type: object
            required: [date, slug, title, provider]
            properties:
              date: {type: string, format: date}
              slug: {type: string}
              title: {type: string}
              provider: {type: string, enum: [FIXTURE, LEETCODE]}
        featured:
          type: object
          required:
          - title
          - difficulty
          - topics
          - url
          - task
          properties:
            title:
              type: string
            difficulty:
              type: string
              enum:
              - EASY
              - MEDIUM
              - HARD
            topics:
              type: array
              items:
                type: string
            url:
              type:
              - string
              - 'null'
              format: uri
            task:
              $ref: '#/components/schemas/RewardTask'
        quests:
          type: array
          items:
            $ref: '#/components/schemas/RewardTask'
        badges:
          type: array
          items:
            type: object
            required:
            - code
            - ruleVersion
            - unlockedAt
            properties:
              code:
                type: string
                enum:
                - FIRST_SOLVE
                - THREE_DAY_STREAK
              ruleVersion:
                type: integer
                minimum: 0
              unlockedAt:
                type: string
                format: date-time
    GroupFeatured:
      type: object
      required:
      - title
      - startsAt
      - endsAt
      - cutoffAt
      - members
      - completed
      properties:
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        members:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
    GroupSettings:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 280
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]
          default: PRIVATE
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 280
    GroupSummary:
      type: object
      required:
      - id
      - name
      - description
      - role
      - visibility
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]
    GroupDirectory:
      type: object
      required:
      - items
      - demoAvailable
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummary'
        demoAvailable:
          type: boolean
    GroupDetail:
      type: object
      required:
      - group
      - members
      properties:
        group:
          $ref: '#/components/schemas/GroupSummary'
        members:
          type: array
          items:
            type: object
            required:
            - id
            - handle
            - displayName
            - role
            properties:
              id:
                type: string
              handle:
                type: string
              displayName:
                type: string
              role:
                type: string
                enum:
                - OWNER
                - MEMBER
    GroupInvite:
      type: object
      required:
      - id
      - expiresAt
      - revokedAt
      - maxUses
      - uses
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
        uses:
          type: integer
          minimum: 0
          maximum: 100
    CreatedGroupInvite:
      type: object
      required:
      - id
      - code
      - expiresAt
      - maxUses
      properties:
        id:
          type: string
        code:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
    GroupStandings:
      type: object
      required:
      - period
      - mode
      - periodStart
      - periodEnd
      - timezone
      - generatedAt
      - items
      - nextCursor
      properties:
        period:
          type: string
          enum:
          - weekly
          - monthly
          - all-time
        mode:
          type: string
          enum:
          - live
          - demo
        periodStart:
          type: [string, 'null']
          format: date-time
          description: Inclusive UTC start. Null for all-time standings.
        periodEnd:
          type: [string, 'null']
          format: date-time
          description: Exclusive UTC end. Null for all-time standings.
        timezone:
          type: string
          enum:
          - UTC
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required:
            - id
            - displayName
            - handle
            - rank
            - xp
            properties:
              id:
                type: string
              displayName:
                type: string
              handle:
                type: string
              rank:
                type: integer
                minimum: 1
              xp:
                type: integer
        nextCursor:
          type:
          - string
          - 'null'
    LinkStatus:
      type: object
      required: [state, handle, fixture, demoAvailable, previewEnabled, syncAvailable, ownershipCode, providerPaused, syncState, failureCode, coverageUncertain, activatedAt, lastAttemptAt, lastSuccessfulSyncAt, nextSyncAt, manualSyncAvailableAt]
      properties:
        state:
          type: string
          enum: [NONE, PENDING, VERIFIED, DISCONNECTED]
        handle:
          type: [string, 'null']
        fixture:
