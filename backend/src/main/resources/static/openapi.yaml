          type: boolean
        previewEnabled:
          type: boolean
        syncAvailable:
          type: boolean
        ownershipCode:
          type: [string, 'null']
          description: Code to keep as a separate word in the public LeetCode Real Name while solve sync is enabled.
        providerPaused:
          type: boolean
        syncState:
          type: [string, 'null']
          enum: [QUEUED, RUNNING, IDLE, RETRY, PAUSED, null]
        failureCode:
          type: [string, 'null']
        coverageUncertain:
          type: boolean
        activatedAt:
          type: [string, 'null']
          format: date-time
        lastAttemptAt:
          type: [string, 'null']
          format: date-time
        lastSuccessfulSyncAt:
          type: [string, 'null']
          format: date-time
        nextSyncAt:
          type: [string, 'null']
          format: date-time
        manualSyncAvailableAt:
          type: [string, 'null']
          format: date-time
    XpEntry:
      type: object
      required: [id, provider, reason, amount, ruleVersion, problemTitle, difficulty, effectiveAt, recordedAt]
