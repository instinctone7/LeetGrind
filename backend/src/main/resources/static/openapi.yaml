      summary: Get curated problems and personal recorded solve status
      security:
      - AccessToken: []
      parameters:
      - $ref: '#/components/parameters/CompetitionMode'
      responses:
        '200':
          description: Practice problems in the selected mode.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
